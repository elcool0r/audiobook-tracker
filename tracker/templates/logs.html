{% extends 'base.html' %}
{% block content %}
<div class="container-fluid px-3 px-sm-4">
<h1>Auth Logs (Admin)</h1>
<div class="d-flex align-items-center mb-3">
  <button class="btn btn-sm btn-outline-primary me-2" id="refresh">Refresh</button>
  <span class="ms-3 small text-muted">Showing last 100 logs</span>
</div>
<div id="logsTable"></div>
<script type="application/json" id="logs-data">{{ logs | tojson }}</script>
<script>
const logsData = JSON.parse(document.getElementById('logs-data').textContent);

function render() {
  const container = document.getElementById('logsTable');
  container.innerHTML = '';
  if (!logsData.length) { container.innerHTML = '<div class="alert alert-info">No logs yet.</div>'; return; }

  const table = document.createElement('table');
  table.className = 'table table-sm table-striped';
  table.innerHTML = '<thead><tr><th>Timestamp</th><th>Event</th><th>Username</th><th>IP</th><th>User-Agent</th><th>Details</th></tr></thead>';
  const tbody = document.createElement('tbody');
  logsData.forEach(l => {
    const tr = document.createElement('tr');
    let timestamp;
    try { timestamp = new Date(l.timestamp).toLocaleString(); } catch (e) { timestamp = l.timestamp; }
    // Every field below is attacker-controlled: `username` and `user_agent` come
    // straight off unauthenticated login attempts. Build cells with textContent so
    // a crafted User-Agent cannot run script in an admin's session.
    [timestamp, l.event, l.username, l.ip, l.user_agent, l.details].forEach(value => {
      const td = document.createElement('td');
      td.textContent = value == null ? '' : String(value);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  container.appendChild(table);
}

document.getElementById('refresh').addEventListener('click', () => location.reload());

render();
</script>
</div>
{% endblock %}
